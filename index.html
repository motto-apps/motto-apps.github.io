<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5eee0">
<title>Motto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5eee0; --card:#fffaf1; --ink:#3b342b; --muted:#8a7f70; --accent:#b08d57; --line:#e6dccb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); }
  body { color:var(--ink); font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:40px 20px 32px; text-align:center; -webkit-font-smoothing:antialiased; }
  .hidden { display:none !important; }

  .arrow { position:fixed; top:4px; right:12px; width:72px; height:72px; animation:float 1.6s ease-in-out infinite; }
  @keyframes float { 50% { transform:translate(5px,-6px); } }

  .logo { width:96px; height:96px; border-radius:50%; background:#efe4cf; display:flex; align-items:center;
          justify-content:center; font-family:"Playfair Display",serif; font-size:24px; color:var(--ink);
          margin:48px auto 28px; box-shadow:0 0 0 1px var(--line); }
  .lead { font-size:13px; letter-spacing:.2em; color:var(--muted); margin-bottom:14px; }
  h1 { font-size:22px; font-weight:600; line-height:1.9; letter-spacing:.04em; margin-bottom:28px; }
  h1 em { font-style:normal; color:var(--accent); border-bottom:1px solid var(--accent); padding-bottom:1px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 24px;
          width:100%; max-width:340px; text-align:left; }
  .step { display:flex; align-items:center; gap:14px; font-size:15px; line-height:1.6; padding:8px 0; }
  .step + .step { border-top:1px dashed var(--line); }
  .num { flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--accent); color:var(--accent);
         font-family:"Playfair Display",serif; font-size:13px; display:flex; align-items:center; justify-content:center; }

  .note { margin-top:26px; font-size:12px; line-height:2; color:var(--muted); }
  .btn { display:inline-block; margin-top:18px; padding:13px 30px; border-radius:999px; border:1px solid var(--ink);
         color:var(--ink); text-decoration:none; font-size:14px; letter-spacing:.08em; background:transparent; }
  .quote { margin-top:auto; padding-top:36px; font-size:12px; color:var(--muted); letter-spacing:.1em; }

  #normal { margin-top:30vh; color:var(--muted); font-size:14px; line-height:2.2; }
  #normal a { color:var(--muted); }
</style>
</head>
<body>
  <div id="normal">
    <p>Motto へ移動しています…</p>
    <p><a href="https://linktr.ee/motto_app">移動しない場合はこちら</a></p>
  </div>

  <div id="guide" class="hidden">
    <svg class="arrow" viewBox="0 0 100 100" fill="none" stroke="#b08d57" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 82 L80 24"/><path d="M46 22 H82 V58"/>
    </svg>
    <div class="logo">Motto</div>
    <p class="lead">ひとつだけ、お願いがあります</p>
    <h1>右上の <em>「…」</em> から<br><em>ブラウザで開く</em> を選んでください</h1>
    <div class="card">
      <div class="step"><span class="num">1</span>右上の「…」をタップ</div>
      <div class="step"><span class="num">2</span>「ブラウザで開く」をタップ</div>
      <div class="step"><span class="num">3</span>開いたページからアプリを選ぶ</div>
    </div>
    <p class="note">TikTokの中ではApp Storeを開けないため<br>ブラウザでの表示をお願いしています</p>
    <a class="btn" id="openBtn" href="#">ブラウザで開く</a>
  </div>

<script>
  var TARGET = 'https://linktr.ee/motto_app';
  var ua = navigator.userAgent || '';
  var isTikTok = /musical_ly|BytedanceWebview|TikTok|ByteLocale|trill/i.test(ua) || /[?&]tt=1/.test(location.search);
  if (isTikTok) {
    document.getElementById('normal').classList.add('hidden');
    document.getElementById('guide').classList.remove('hidden');
    document.getElementById('openBtn').href = 'x-safari-' + TARGET;
  } else {
    location.replace(TARGET);
  }
</script>
</body>
</html>
